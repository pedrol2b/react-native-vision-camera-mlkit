name: Build Package

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Verify generated Nitro specs are current
        run: |
          yarn specs
          if [ -n "$(git status --porcelain --untracked-files=all -- nitrogen)" ]; then
            echo "Generated Nitro specs are out of date. Run 'yarn specs' and commit the results."
            git status --short --untracked-files=all -- nitrogen
            git diff -- nitrogen
            exit 1
          fi

      - name: Build library
        run: yarn prepare
